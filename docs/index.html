<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proxima Daily</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
         background:#f5f5f5;min-height:100vh;display:flex;
         flex-direction:column;align-items:center;justify-content:center;padding:2rem}
    h1{font-size:1.8rem;font-weight:700;letter-spacing:-0.5px;margin-bottom:.3rem}
    .sub{color:#666;font-size:.9rem;margin-bottom:2.5rem}
    .cards{display:flex;gap:1.2rem;flex-wrap:wrap;justify-content:center;margin-bottom:2rem}
    .card{background:#fff;border-radius:16px;padding:2rem 2.5rem;text-align:center;
          box-shadow:0 2px 12px rgba(0,0,0,.08);text-decoration:none;color:inherit;
          min-width:160px;transition:transform .15s,box-shadow .15s}
    .card:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,.13)}
    .card .initial{font-size:3rem;font-weight:700;line-height:1}
    .card .label{font-size:.85rem;color:#888;margin-top:.4rem}
    .card.alex .initial{color:#3a7bd5}
    .card.vale .initial{color:#e05c5c}
    .btn{background:#222;color:#fff;border:none;border-radius:12px;
         padding:.85rem 2rem;font-size:.95rem;cursor:pointer;
         text-decoration:none;display:inline-block;transition:background .15s}
    .btn:hover{background:#444}
    .ts{font-size:.75rem;color:#aaa;margin-top:1.5rem}
    .status{display:inline-flex;align-items:center;gap:.5rem;
            background:#fff;border-radius:20px;padding:.5rem 1rem;
            font-size:.85rem;margin-bottom:2rem;box-shadow:0 1px 6px rgba(0,0,0,.06);
            color:#666}
    .dot{width:10px;height:10px;border-radius:50%;background:#aaa;flex-shrink:0}
    .status.ok{color:#1a7a3e}
    .status.ok .dot{background:#3ac26b}
    .status.stale{color:#a83232}
    .status.stale .dot{background:#e05c5c}
  </style>
</head>
<body>
  <h1>Proxima Daily</h1>
  <p class="sub">Briefing mattutino · aggiornato ogni giorno</p>
  <div id="status" class="status"><span class="dot"></span><span id="status-text">Verifica aggiornamento…</span></div>
  <div class="cards">
    <a class="card alex" href="alex-latest.html">
      <div class="initial">A</div>
      <div class="label">Alex</div>
    </a>
    <a class="card vale" href="vale-latest.html">
      <div class="initial">V</div>
      <div class="label">Vale</div>
    </a>
  </div>
  <a class="btn" href="https://github.com/bigfatneko/main-marketing/actions/workflows/briefing.yml"
     target="_blank">⟳ Rigenera ora</a>
  <script>
    (function(){
      var el = document.getElementById('status');
      var txt = document.getElementById('status-text');
      var GIORNI = ['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
      var MESI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
      function fmt(d){ return GIORNI[d.getDay()]+' '+d.getDate()+' '+MESI[d.getMonth()]; }
      function daysBetween(a,b){ return Math.round((b - a) / 86400000); }
      fetch('last-generated.txt?t='+Date.now())
        .then(function(r){ if(!r.ok) throw new Error('404'); return r.text(); })
        .then(function(t){
          var s = t.trim();
          var parts = s.split('-');
          var gen = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
          var oggi = new Date(); oggi.setHours(0,0,0,0);
          var diff = daysBetween(gen, oggi);
          // sabato genera, domenica/lunedì mattina presto può essere "vecchio di 1-2 giorni" legittimamente
          var dow = oggi.getDay();
          var soglia = (dow === 0) ? 1 : (dow === 1 ? 2 : 1);
          if(diff <= 0){
            el.classList.add('ok');
            txt.textContent = 'Aggiornato oggi · '+fmt(gen);
          } else if(diff <= soglia){
            el.classList.add('ok');
            txt.textContent = 'Ultimo: '+fmt(gen)+' ('+diff+'g fa)';
          } else {
            el.classList.add('stale');
            txt.textContent = '⚠ Vecchio di '+diff+' giorni · ultimo: '+fmt(gen);
          }
        })
        .catch(function(){
          el.classList.add('stale');
          txt.textContent = '⚠ Stato sconosciuto';
        });
    })();
  </script>
</body>
</html>
