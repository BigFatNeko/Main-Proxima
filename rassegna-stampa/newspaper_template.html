<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <style>
    :root {
      --c-bg: #fafaf7;
      --c-bg-card: #fff;
      --c-bg-secondary: #f4f3ee;
      --c-text: #1a1a1a;
      --c-text-secondary: #5a5a5a;
      --c-text-tertiary: #8a8a8a;
      --c-border: #d8d6cf;
      --c-border-soft: #e8e6df;
      --c-link: #2563a8;
      --c-success-bg: #e6f1de;
      --c-success: #2d6a1f;
      --c-danger-bg: #f5dad9;
      --c-danger: #a02822;
      --c-warning-bg: #f7ecc7;
      --c-warning: #8a6d1a;
      --font-serif: "Source Serif Pro", "Crimson Pro", Georgia, "Times New Roman", serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --c-bg: #1a1916;
        --c-bg-card: #232220;
        --c-bg-secondary: #2a2926;
        --c-text: #e8e6df;
        --c-text-secondary: #b0aea7;
        --c-text-tertiary: #8a8a8a;
        --c-border: #3a3936;
        --c-border-soft: #2e2d2a;
        --c-link: #6ba3e0;
        --c-success-bg: #2a3a22;
        --c-success: #98c483;
        --c-danger-bg: #3d2625;
        --c-danger: #d8857f;
        --c-warning-bg: #3a3422;
        --c-warning: #d4b87a;
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: var(--font-sans);
      background: var(--c-bg);
      color: var(--c-text);
      line-height: 1.55;
      margin: 0;
      padding: 0;
      font-size: 15px;
    }
    .paper {
      max-width: 760px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }
    .masthead {
      text-align: center;
      border-top: 2px solid var(--c-text);
      border-bottom: 1px solid var(--c-border);
      padding: 1.2rem 0 1rem;
      margin-bottom: 2rem;
    }
    .masthead h1 {
      font-family: var(--font-serif);
      font-size: 38px;
      font-weight: 600;
      margin: 0 0 6px;
      letter-spacing: -1px;
      line-height: 1;
    }
    .masthead .sub {
      font-size: 11px;
      color: var(--c-text-secondary);
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    article {
      font-family: var(--font-sans);
    }
    article h2 {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 600;
      margin: 2.2rem 0 0.8rem;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--c-border);
      color: var(--c-text);
    }
    article h2:first-of-type {
      margin-top: 0.5rem;
    }
    article h3 {
      font-size: 17px;
      font-weight: 600;
      margin: 1.4rem 0 0.5rem;
      line-height: 1.35;
      color: var(--c-text);
    }
    article p {
      margin: 0.5rem 0 0.8rem;
      line-height: 1.65;
      font-size: 14.5px;
    }
    article a {
      color: var(--c-link);
      text-decoration: none;
    }
    article a:hover {
      text-decoration: underline;
    }
    article ol,
    article ul {
      margin: 0.5rem 0 1rem;
      padding-left: 1.6rem;
    }
    article ol li,
    article ul li {
      margin: 0.3rem 0;
      line-height: 1.6;
      font-size: 14.5px;
    }
    article blockquote {
      margin: 0.8rem 0 1.2rem;
      padding: 0.6rem 1rem;
      border-left: 3px solid var(--c-border);
      background: var(--c-bg-secondary);
      font-size: 13.5px;
      color: var(--c-text-secondary);
      border-radius: 0 6px 6px 0;
    }
    article blockquote strong {
      color: var(--c-text);
      font-weight: 600;
    }
    article blockquote p {
      margin: 0.3rem 0;
    }
    article blockquote ul {
      margin: 0.4rem 0 0;
      padding-left: 1.2rem;
    }
    article blockquote li {
      font-size: 13px;
      margin: 0.2rem 0;
    }
    article code {
      font-family: var(--font-mono);
      font-size: 12px;
      background: var(--c-bg-secondary);
      padding: 1px 6px;
      border-radius: 3px;
      color: var(--c-text-secondary);
    }
    article pre {
      background: var(--c-bg-secondary);
      padding: 0.8rem 1rem;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 12.5px;
    }
    article table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0 1.4rem;
      font-size: 13px;
    }
    article table th,
    article table td {
      padding: 8px 10px;
      text-align: left;
      border-bottom: 1px solid var(--c-border-soft);
    }
    article table th {
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--c-text-secondary);
      background: var(--c-bg-secondary);
      border-bottom: 1px solid var(--c-border);
    }
    article table tr:hover td {
      background: var(--c-bg-secondary);
    }
    article hr {
      border: none;
      border-top: 1px solid var(--c-border-soft);
      margin: 2rem 0;
    }
    article strong {
      font-weight: 600;
      color: var(--c-text);
    }
    article em {
      font-style: italic;
      color: var(--c-text-secondary);
    }
    .lede {
      background: var(--c-bg-secondary);
      border-radius: 8px;
      padding: 1.2rem 1.5rem;
      margin: 1.5rem 0;
    }
    .actions {
      background: var(--c-bg-card);
      border: 1px solid var(--c-border);
      border-radius: 8px;
      padding: 1.2rem;
      margin: 2rem 0 1rem;
    }
    .actions h2 {
      margin-top: 0;
      border-bottom: none;
      padding-bottom: 0;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--c-text-secondary);
    }
    .footer {
      text-align: center;
      font-size: 11px;
      color: var(--c-text-tertiary);
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid var(--c-border-soft);
      font-style: italic;
      line-height: 1.6;
    }
    @media print {
      body { background: #fff; color: #000; font-size: 11pt; }
      .paper { max-width: 100%; padding: 0; }
      a { color: #000; text-decoration: none; }
      a::after { content: " [" attr(href) "]"; font-size: 9pt; color: #555; }
      blockquote { background: #f5f5f5; }
    }
    @media (max-width: 600px) {
      .paper { padding: 1.5rem 1rem 3rem; }
      .masthead h1 { font-size: 30px; }
      article table { font-size: 12px; }
      article table th, article table td { padding: 6px 8px; }
    }
  </style>
</head>
<body>
  <div class="paper">

    <div class="masthead">
      <h1>{{ title }}</h1>
      <div class="sub">{{ date }} &middot; {{ user|title }} &middot; {{ mode }}</div>
    </div>

    <article>
      {{ body|safe }}
    </article>

  </div>
</body>
</html>
