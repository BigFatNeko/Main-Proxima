<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" font-family="'Plus Jakarta Sans', Arial, sans-serif">
  <!-- BOZZA direzione D (consigliata): torre sintetica con slancio verticale
       + stella a 4 punte gold sospesa sopra i merli.
       La solidità sotto, la stella oltre — "oltre i limiti comuni". -->
  <rect width="560" height="200" fill="#F5F3EE"/>

  <g transform="translate(100,172)">
    <!-- Torre sintetica: fusto rastremato verso l'alto (slancio), cornicione, tre merli -->
    <path d="M -26,0 L -18,-104 L 18,-104 L 26,0 Z" fill="#0D2B4E"/>
    <rect x="-26" y="-118" width="52" height="12" rx="2" fill="#0D2B4E"/>
    <rect x="-26" y="-134" width="11" height="16" fill="#0D2B4E"/>
    <rect x="-5.5" y="-134" width="11" height="16" fill="#0D2B4E"/>
    <rect x="15" y="-134" width="11" height="16" fill="#0D2B4E"/>

    <!-- La stella oltre la torre: 4 punte asimmetriche, gold -->
    <g transform="translate(0,-160)">
      <path d="M 0,-19
               C 2,-7 5,-3.5 15,-1.5
               C 5,0.5 2.5,3.5 1.5,12
               C 0,3.5 -3.5,1 -12,0
               C -3.5,-1.5 -1.5,-5 0,-19 Z"
            fill="#C4A44A"/>
    </g>
  </g>

  <!-- Wordmark (segnaposto) -->
  <text x="195" y="106" font-size="58" font-weight="700" fill="#0D2B4E" letter-spacing="-1">proxima</text>
  <text x="198" y="139" font-size="17" font-weight="400" fill="#0D2B4E" opacity="0.7" font-family="'DM Sans', Arial, sans-serif" letter-spacing="0.5">Consulenza finanziaria indipendente</text>
</svg>
