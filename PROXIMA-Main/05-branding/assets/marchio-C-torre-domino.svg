<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" font-family="'Plus Jakarta Sans', Arial, sans-serif">
  <!-- BOZZA direzione C: il concetto di partenza — torre (scacchi) + due domino
       che si appoggiano senza farla cadere. Scena illustrativa: nel sistema vive
       come illustrazione-chiave; per il marchio vedi la sintesi D. -->
  <rect width="560" height="200" fill="#F5F3EE"/>

  <g transform="translate(100,168)">
    <!-- Torre: basamento, fusto, cornicione, merli -->
    <rect x="-34" y="-12" width="68" height="12" rx="2" fill="#0D2B4E"/>
    <rect x="-24" y="-100" width="48" height="88" fill="#0D2B4E"/>
    <rect x="-32" y="-112" width="64" height="14" rx="2" fill="#0D2B4E"/>
    <rect x="-32" y="-130" width="13" height="18" fill="#0D2B4E"/>
    <rect x="-6.5" y="-130" width="13" height="18" fill="#0D2B4E"/>
    <rect x="19" y="-130" width="13" height="18" fill="#0D2B4E"/>

    <!-- Domino 1: appoggiato al fianco sinistro -->
    <g transform="translate(-52,-22) rotate(-62)">
      <rect x="-9" y="-34" width="18" height="68" rx="4" fill="#1D4A52"/>
      <line x1="-9" y1="0" x2="9" y2="0" stroke="#F5F3EE" stroke-width="2"/>
      <circle cx="0" cy="-17" r="3" fill="#F5F3EE"/>
      <circle cx="-3.5" cy="13" r="3" fill="#F5F3EE"/>
      <circle cx="3.5" cy="21" r="3" fill="#C4A44A"/>
    </g>
    <!-- Domino 2: caduto contro il primo (la catena si ferma qui) -->
    <g transform="translate(-92,-12) rotate(-38)">
      <rect x="-9" y="-30" width="18" height="60" rx="4" fill="#1D4A52" opacity="0.85"/>
      <line x1="-9" y1="0" x2="9" y2="0" stroke="#F5F3EE" stroke-width="2"/>
      <circle cx="0" cy="-15" r="3" fill="#F5F3EE"/>
      <circle cx="0" cy="15" r="3" fill="#F5F3EE"/>
    </g>
  </g>

  <!-- Wordmark (segnaposto) -->
  <text x="205" y="106" font-size="58" font-weight="700" fill="#0D2B4E" letter-spacing="-1">proxima</text>
  <text x="208" y="139" font-size="17" font-weight="400" fill="#0D2B4E" opacity="0.7" font-family="'DM Sans', Arial, sans-serif" letter-spacing="0.5">Consulenza finanziaria indipendente</text>
</svg>
