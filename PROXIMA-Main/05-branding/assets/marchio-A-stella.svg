<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" font-family="'Plus Jakarta Sans', Arial, sans-serif">
  <!-- BOZZA direzione A: segno "stella" (4 punte asimmetriche, la punta lunga va in alto a destra = "oltre")
       + wordmark. Il wordmark usa un font di sistema come segnaposto: l'esecutivo va disegnato. -->
  <rect width="560" height="200" fill="#F5F3EE"/>

  <!-- Segno: stella di navigazione, gold -->
  <g transform="translate(95,95)">
    <path d="M 0,-58
             C 6,-22 16,-10 44,-4
             C 16,2 8,10 4,34
             C 0,10 -10,4 -34,0
             C -10,-4 -4,-14 0,-58 Z"
          fill="#C4A44A" transform="rotate(18)"/>
  </g>

  <!-- Wordmark (segnaposto) -->
  <text x="170" y="112" font-size="58" font-weight="700" fill="#0D2B4E" letter-spacing="-1">proxima</text>

  <!-- Descrittore di categoria (lockup obbligatorio nei primi contatti) -->
  <text x="173" y="145" font-size="17" font-weight="400" fill="#0D2B4E" opacity="0.7" font-family="'DM Sans', Arial, sans-serif" letter-spacing="0.5">Consulenza finanziaria indipendente</text>
</svg>
