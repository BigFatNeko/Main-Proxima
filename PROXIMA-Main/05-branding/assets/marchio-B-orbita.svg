<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" font-family="'Plus Jakarta Sans', Arial, sans-serif">
  <!-- BOZZA direzione B: monogramma "P" con orbita e punto gold (il cliente che avanza).
       Lettera in font di sistema come segnaposto: l'esecutivo va disegnato. -->
  <rect width="560" height="200" fill="#F5F3EE"/>

  <g transform="translate(95,100)">
    <!-- Monogramma -->
    <text x="0" y="30" font-size="92" font-weight="700" fill="#0D2B4E" text-anchor="middle">P</text>
    <!-- Orbita -->
    <ellipse cx="0" cy="0" rx="72" ry="26" fill="none" stroke="#1D4A52" stroke-width="2.5" transform="rotate(-24)"/>
    <!-- Punto gold sull'orbita (in alto a destra = direzione di crescita) -->
    <circle cx="58" cy="-38" r="7.5" fill="#C4A44A"/>
  </g>

  <!-- Wordmark (segnaposto) -->
  <text x="205" y="112" font-size="58" font-weight="700" fill="#0D2B4E" letter-spacing="-1">proxima</text>
  <text x="208" y="145" font-size="17" font-weight="400" fill="#0D2B4E" opacity="0.7" font-family="'DM Sans', Arial, sans-serif" letter-spacing="0.5">Consulenza finanziaria indipendente</text>
</svg>
