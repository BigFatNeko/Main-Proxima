<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Proxima — Modello Previsionale SCF (a strati)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0C1420; --card: #121E30; --card-hi: #17243A; --border: #1E2A3E;
    --border-hi: #2A3952; --gold: #C4A962; --gold-dim: #8E7940; --text: #E8ECF2;
    --text-dim: #8B98B0; --text-faint: #5C6B84; --success: #4ADE80; --warning: #F59E0B;
    --danger: #F87171; --info: #60A5FA;
    --s1: #60A5FA; --s2: #A78BFA; --s3: #C4A962;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); font-family: 'DM Sans', system-ui, sans-serif; font-size: 14px; line-height: 1.5; }
  body { min-height: 100vh; overflow-x: hidden; }
  .mono { font-family: 'DM Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .gold { color: var(--gold); } .text-dim { color: var(--text-dim); } .text-faint { color: var(--text-faint); }
  .uppercase { text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; font-weight: 500; }

  .app { display: grid; grid-template-columns: 360px 1fr; min-height: 100vh; }
  .sidebar { background: var(--card); border-right: 1px solid var(--border); padding: 20px; overflow-y: auto; max-height: 100vh; position: sticky; top: 0; }
  .main { padding: 24px 32px; max-width: 100%; overflow-x: hidden; }
  @media (max-width: 1100px) { .app { grid-template-columns: 1fr; } .sidebar { position: static; max-height: none; } }

  .brand { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .brand h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .brand-tag { color: var(--gold); font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
  .subtitle { color: var(--text-dim); font-size: 13px; margin-bottom: 24px; }

  .panel { background: var(--card-hi); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 14px; overflow: hidden; }
  .panel-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; cursor: pointer; user-select: none; background: var(--card-hi); }
  .panel-header:hover { background: var(--border); }
  .panel-header h3 { font-size: 13px; font-weight: 600; letter-spacing: 0.02em; }
  .panel-header .chev { color: var(--gold); font-size: 10px; }
  .panel-body { padding: 8px 14px 16px; border-top: 1px solid var(--border); background: var(--card); }

  .slider-row { margin-bottom: 14px; } .slider-row:last-child { margin-bottom: 0; }
  .slider-label { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; gap: 8px; }
  .slider-label .name { font-size: 12px; color: var(--text-dim); flex: 1; }
  .slider-label .val { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--gold); font-weight: 500; }
  input[type=range] { width: 100%; -webkit-appearance: none; appearance: none; height: 4px; background: var(--border); border-radius: 2px; outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: var(--gold); border-radius: 50%; cursor: pointer; border: 2px solid var(--bg); }
  input[type=range]::-moz-range-thumb { width: 14px; height: 14px; background: var(--gold); border-radius: 50%; cursor: pointer; border: 2px solid var(--bg); }

  .section { margin-bottom: 32px; }
  .section-title { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 14px; font-weight: 500; }

  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .kpi-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; }
  .kpi-card.accent { border-color: var(--gold-dim); background: linear-gradient(180deg, rgba(196,169,98,0.04) 0%, var(--card) 100%); }
  .kpi-label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; }
  .kpi-value { font-family: 'DM Mono', monospace; font-size: 28px; font-weight: 500; color: var(--text); letter-spacing: -0.02em; }
  .kpi-sub { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text-dim); margin-top: 6px; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .card-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .card-sub { font-size: 12px; color: var(--text-dim); margin-bottom: 16px; }

  .tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--card); }
  table.proj { width: 100%; border-collapse: collapse; font-family: 'DM Mono', monospace; font-size: 12px; }
  table.proj thead { background: var(--card-hi); position: sticky; top: 0; z-index: 2; }
  table.proj th { text-align: right; padding: 10px 8px; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dim); font-weight: 500; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.proj th:first-child, table.proj td:first-child { text-align: left; position: sticky; left: 0; background: inherit; z-index: 1; }
  table.proj td { padding: 8px; text-align: right; border-bottom: 1px solid var(--border); color: var(--text); white-space: nowrap; }
  table.proj tr:hover td { background: var(--card-hi); }
  table.proj tr.phase-boundary td { border-top: 2px solid var(--gold-dim); }
  table.proj tr.capacity-limited td { background: rgba(245,158,11,0.05); }
  table.proj tr.break-even td { background: rgba(74,222,128,0.08); }
  table.proj tr.actual-data td { background: rgba(96,165,250,0.06); }
  table.proj tr.pre-release td { opacity: 0.7; }
  table.proj tr.pre-release:hover td { opacity: 1; }
  .pill { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; letter-spacing: 0.04em; }
  .pill-p1 { background: #1E2A3E; color: var(--text-dim); }
  .pill-p2 { background: #2A3952; color: var(--text); }
  .pill-p3 { background: rgba(96,165,250,0.15); color: var(--info); }
  .pill-p4 { background: rgba(167,139,250,0.2); color: var(--s2); }
  .pill-p5 { background: rgba(196,169,98,0.2); color: var(--gold); }
  .pill-p6 { background: rgba(74,222,128,0.15); color: var(--success); }

  .btn { background: var(--gold); color: var(--bg); border: 0; padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: 12px; cursor: pointer; font-family: inherit; letter-spacing: 0.02em; }
  .btn:hover { background: #D6BC73; }
  .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--gold); color: var(--gold); }

  .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 900px) { .chart-row { grid-template-columns: 1fr; } }

  .warn-banner { background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.25); border-radius: 10px; padding: 12px 14px; color: var(--warning); font-size: 13px; display: flex; align-items: center; gap: 10px; }
  .info-banner { background: rgba(96,165,250,0.08); border: 1px solid rgba(96,165,250,0.2); border-radius: 10px; padding: 12px 14px; color: var(--info); font-size: 13px; }
  .toolbar { display: flex; gap: 8px; justify-content: flex-end; margin-bottom: 14px; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--gold-dim); }

  .scenario-group { display: flex; gap: 8px; margin-bottom: 14px; }
  .scenario-btn { flex: 1; padding: 8px 4px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text-dim); font-size: 12px; font-weight: 500; cursor: pointer; text-align: center; font-family: inherit; transition: all 0.15s; }
  .scenario-btn:hover { border-color: var(--gold-dim); }
  .scenario-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(196,169,98,0.08); }
  .scenario-btn.scenario-base.active { border-color: var(--success); color: var(--success); background: rgba(74,222,128,0.08); }
  .scenario-btn.scenario-recessione.active { border-color: var(--warning); color: var(--warning); background: rgba(245,158,11,0.08); }
  .scenario-btn.scenario-crisi.active { border-color: var(--danger); color: var(--danger); background: rgba(248,113,113,0.08); }

  @media print {
    .sidebar, .toolbar { display: none !important; }
    .app { display: block !important; }
    .main { padding: 8px 0 !important; max-width: 100% !important; }
    html, body { background: #fff !important; color: #111 !important; }
    .card, .kpi-card { background: #fff !important; border: 1px solid #bbb !important; break-inside: avoid; }
    .kpi-value, .card-title, .section-title, .gold, .mono, td, th { color: #111 !important; }
    .kpi-label, .text-dim, .text-faint, .card-sub { color: #555 !important; }
    table.proj thead { background: #eee !important; }
    .section { break-inside: avoid; }
    .info-banner, .warn-banner { border: 1px solid #bbb !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>

<script type="text/babel" data-presets="env,react">
/* ============================================================
   Proxima — Modello Previsionale SCF "a strati"  (48 mesi: M-6 → M+41)
   Ricavo fee-only diretto dal cliente, su 3 strati:
     S1  app freemium (abbonamento base, consigli per classe di rischio)
     S2  abbonamento + pacchetti, consulenza remota (telefono/webcam)
     S3  consulenza in presenza — parcella selezionabile: %AUM | fissa | modulare
   Niente split SIM. Costi allineati al doc 61 (budget modello a strati).
   ============================================================ */
window.PROXIMA = window.PROXIMA || {};

var LAUNCH_M = 7;   // M0
var HORIZON = 48;   // M-6 (m=1) ... M+41 (m=48)

window.PROXIMA.getPhase = function (m) {
  if (m <= 3) return 1;    // M-6..M-4  Costituzione & compliance
  if (m <= 6) return 2;    // M-3..M-1  App MVP & pre-lancio
  if (m <= 12) return 3;   // M0..M+5   Lancio Strato 1 (freemium)
  if (m <= 18) return 4;   // M+6..M+11 Strato 2 (abbonamenti + pacchetti)
  if (m <= 30) return 5;   // M+12..M+23 Strato 3 a regime + scaling
  return 6;                // M+24..     Scala nazionale
};

window.PROXIMA.phaseNames = {
  1: 'Costituzione & compliance', 2: 'App MVP & pre-lancio',
  3: 'Lancio Strato 1', 4: 'Strato 2 (remoto)',
  5: 'Strato 3 a regime', 6: 'Scala nazionale'
};

window.PROXIMA.monthLabel = function (m) {
  if (m < LAUNCH_M) return 'M-' + (LAUNCH_M - m);
  if (m === LAUNCH_M) return 'M0';
  return 'M+' + (m - LAUNCH_M);
};

window.PROXIMA.defaultParams = function () {
  return {
    riskScenario: 'base',
    startingCapital: 180000,

    /* --- Acquisizione: canali → lead → download app (utenti free) --- */
    google:  { cpc: 1.20, clickToLead: 0.45, budgetByPhase: { 1:0, 2:150, 3:700, 4:1100, 5:1500, 6:1800 } },
    meta:    { cpc: 0.70, clickToLead: 0.30, budgetByPhase: { 1:0, 2:250, 3:1000, 4:1500, 5:1900, 6:2200 } },
    tiktok:  { cpc: 0.40, clickToLead: 0.22, budgetByPhase: { 1:0, 2:150, 3:600, 4:900, 5:1100, 6:1300 } },
    seo:     { baseVisits: 40, growthRate: 0.15, visitToLead: 0.12, maxVisits: 1000 },
    social:  { baseVisits: 70, growthRate: 0.10, visitToLead: 0.08, maxVisits: 1500 },
    leadToDownload: 0.45,
    market:  { tamFree: 15000 },

    /* --- Funnel freemium a strati (tassi mensili) --- */
    freemium: { freeToS1: 0.03, s1ToS2: 0.025, s2ToS3: 0.02 },
    churn: { free: 0.09, s1: 0.04, s2: 0.03, s3: 0.006 },

    /* --- Canale diretto verso S3 (referral / PR / passaparola, bypassa l'app) --- */
    referral: { ratePerS3Client: 0.05, bookingRate: 0.80, startMonth: 13 },
    borrowed: { s3BookingsByPhase: { 1:0, 2:0, 3:2, 4:4, 5:6, 6:8 } },
    directShowRate: 0.75, directToClient: 0.30,

    /* --- Pricing --- */
    priceS1: 7,
    priceS2: 39, s2PackagesPerClientYr: 1.2, s2PackagePrice: 180,

    /* Strato 3 — modalità selezionabile */
    s3FeeMode: 'aum',  // 'aum' | 'fissa' | 'modulare'
    s3: {
      feeRate: 0.009, bonusBps: 0.0015,           // %AUM (+ bonus opzionale in bps su AUM)
      fixedAnnual: 900,                            // parcella fissa annua
      baseFare: 300, checkpointsPerYear: 2, checkpointFee: 220  // modulare
    },
    assetTransferLagMonths: 1,

    /* --- IVA, commissioni di incasso, fatturazione S3 (cassa ≠ competenza) --- */
    vatRate: 0.22,                                              // scorporo dai prezzi (IVA inclusa). 0 = input già netti
    payments: { inAppShare: 0.50, storeFeeRate: 0.15, webFeeRate: 0.025 },  // commissioni solo su S1/S2 (app)
    s3Billing: 'annuale',                                      // 'annuale' | 'semestrale' | 'mensile' (incasso anticipato)

    /* --- AUM (motore cohort per lo Strato 3) --- */
    aum: { avgPerClient: 45000, portfolioReturn: 0.06, benchmark: 0.08,
      annualContributions: 3600, annualWithdrawalRate: 0.03, marketShock: 0,
      dist: { s_pct: 0.40, s_avg: 18000, m_pct: 0.40, m_avg: 45000, l_pct: 0.20, l_avg: 95000 } },

    /* --- Capacità (ore): S3 in presenza + consulti remoti S2 + revisioni S3 ricorrenti --- */
    founderHoursPerWeek: 25, hoursPerS3Onboarding: 4.0, hoursPerS2ConsultMonth: 0.25, hoursPerS3ReviewYear: 2.0,

    /* --- Assunzioni dinamiche --- */
    hiring: {
      consultantCost: 2500, consultantHoursPerWeek: 20, maxConsultants: 4,
      firstConsultantMonth: 13, utilTrigger: 0.85,
      contentCost: 1200, contentMinMonth: 9, contentTriggerUsers: 400,
      devCost: 1500, devMinMonth: 13, devTriggerUsers: 250,
      backOfficeCost: 1000, backOfficeMinMonth: 19, backOfficeTriggerClients: 300
    },

    /* --- App / tech (capex ibrido + ricorrente) --- */
    tech: { sitoLanding: 6000, appS1Build: 14000, appS2Build: 30000, appS2Month: 19,
      infraMonthly: 250, maintPctYr: 0.18 },

    /* --- Costituzione (corretta: niente capitale 50k, RC reale, AML incluso) --- */
    constitution: { notaio: 2000, cciaa: 560, registroBollo: 356, iscrizioneOCF: 550,
      commercialistaIniziale: 1200, avvocato: 2500, assicurazioneRC: 2500,
      esami: 1500, amlSetup: 2000, pecFirma: 100 },

    /* --- Operativi mensili (corretti: OCF ~270/mese, AML, no commercianti) --- */
    operating: { commercialista: 400, quotaOCF: 270, assicurazioneRC: 200,
      software: 300, aml: 80, coworking: 350, pecTelCloud: 150 },

    /* --- Personale: fondatori a €0 fino a compStartMonth (default M+12) --- */
    personnel: { founderComp: 1000, numFounders: 2, inpsRate: 0.2607, compStartMonth: 19 },

    /* --- Altro --- */
    budgetCapAdjust: true, budgetCapThreshold: 0.85,
    reserveTarget: 15000,                                                       // riserva minima di cassa (alert/funding)
    capitalInjections: [ { month: 19, amount: 0 }, { month: 31, amount: 0 } ],  // iniezioni successive (mese sim. 1-48, importo 0 = off)
    waitingList: { count: 200, toS1Rate: 0.40 },
    launchCalendarMonth: 9,
    seasonality: [0, 1.2, 1.0, 1.1, 1.05, 0.95, 0.85, 0.50, 0.40, 1.30, 1.10, 1.0, 0.60],
    actuals: { currentMonth: 0, freeUsers: 0, s1: 0, s2: 0, s3: 0, cashBalance: 0 },
    taxation: { enabled: false, iresRate: 0.24, irapRate: 0.039 }
  };
};

var RISK = {
  base:       { clientMult: 1.0, costMult: 1.0,  churnMult: 1.0 },
  recessione: { clientMult: 0.7, costMult: 1.15, churnMult: 1.5 },
  crisi:      { clientMult: 0.5, costMult: 1.15, churnMult: 2.0 }
};

function constitutionForMonth(m, c) {
  if (m === 1) return c.notaio + c.cciaa + c.registroBollo + c.commercialistaIniziale;
  if (m === 2) return c.iscrizioneOCF + c.pecFirma + c.esami;
  if (m === 3) return c.avvocato;
  if (m === 4) return c.amlSetup;
  if (m === 5) return c.assicurazioneRC;
  return 0;
}

/* Capex tech: sito (m3-5), App S1 MVP low-code (m4-6), App S2 agenzia (appS2Month..+5) */
function techCapexForMonth(m, t) {
  var x = 0;
  if (m >= 3 && m <= 5) x += t.sitoLanding / 3;
  if (m >= 4 && m <= 6) x += t.appS1Build / 3;
  if (m >= t.appS2Month && m < t.appS2Month + 6) x += t.appS2Build / 6;
  return x;
}
/* Ricorrente tech: infra (da M0) + manutenzione (% annua del build, da quando è consegnato) */
function techRecurringForMonth(m, t) {
  var x = 0;
  if (m >= LAUNCH_M) x += t.infraMonthly;
  if (m > 6) x += t.appS1Build * t.maintPctYr / 12;
  if (m >= t.appS2Month + 6) x += t.appS2Build * t.maintPctYr / 12;
  return x;
}

window.PROXIMA.simulate = function (p, months) {
  months = months || HORIZON;
  var results = [];
  var freeUsers = 0, s1 = 0, s2 = 0, cohortsS3 = [];
  var revCum = 0, costCum = 0;
  var risk = RISK[p.riskScenario] || RISK.base;
  var cash = p.startingCapital, cashMin = cash, cashMinMonth = 1;
  var h = p.hiring;
  var hiredConsultants = 0, hasContent = false, hasDev = false, hasBackOffice = false;
  var lastConsultantHireMonth = 0, hiringPlan = [];

  var paidCumSpend = 0, paidCumS1 = 0;   // CAC: spesa paid / nuovi abbonati S1 attribuiti
  var mktCumSpend = 0, newPayingCum = 0; // CAC blended: spesa marketing / nuovi paganti acquisiti
  var cashZeroMonth = null, reserveBreachMonth = null;
  var reserveTarget = p.reserveTarget || 15000;
  var benchMonthly = Math.pow(1 + p.aum.benchmark, 1 / 12) - 1, benchValue = 0;
  var revWindow12 = [], costWindow12 = [];

  for (var m = 1; m <= months; m++) {
    var phase = window.PROXIMA.getPhase(m);
    var phaseName = window.PROXIMA.phaseNames[phase];
    var label = window.PROXIMA.monthLabel(m);
    var isPre = m < LAUNCH_M;
    var calMonth = ((m - LAUNCH_M + (p.launchCalendarMonth || 9) - 1) % 12 + 12) % 12 + 1;
    var season = isPre ? 1 : ((p.seasonality && p.seasonality[calMonth]) ? p.seasonality[calMonth] : 1.0);

    /* --- Capacità in ore (pre-assunzioni di questo mese) --- */
    var fHours = p.founderHoursPerWeek * 4.33;
    var consHours = hiredConsultants * h.consultantHoursPerWeek * 4.33;
    var totHours = fHours + consHours;

    /* --- Budget pubblicitario per fase (pieno) --- */
    var bGFull = p.google.budgetByPhase[phase] || 0;
    var bMFull = p.meta.budgetByPhase[phase] || 0;
    var bTFull = p.tiktok.budgetByPhase[phase] || 0;

    /* --- Traffico organico: curva logistica con plateau (no esplosione esponenziale) --- */
    var seoV = logistic(p.seo.baseVisits, p.seo.maxVisits, p.seo.growthRate, m);
    var socV = logistic(p.social.baseVisits, p.social.maxVisits, p.social.growthRate, m);

    function downloadsFrom(bG, bM, bT) {
      var gLeads = bG > 0 ? (bG / p.google.cpc) * p.google.clickToLead : 0;
      var mLeads = bM > 0 ? (bM / p.meta.cpc) * p.meta.clickToLead : 0;
      var tLeads = bT > 0 ? (bT / p.tiktok.cpc) * p.tiktok.clickToLead : 0;
      var seoLeads = seoV * p.seo.visitToLead;
      var socLeads = socV * p.social.visitToLead;
      var leads = (gLeads + mLeads + tLeads + seoLeads + socLeads) * season;
      var paidLeads = (gLeads + mLeads + tLeads) * season;
      return { total: leads * p.leadToDownload, paid: paidLeads * p.leadToDownload };
    }

    /* --- Churn (sugli stock correnti, prima delle conversioni) --- */
    var cF = p.churn.free, cS1 = p.churn.s1 * risk.churnMult, cS2 = p.churn.s2 * risk.churnMult, cS3 = p.churn.s3 * risk.churnMult;
    var churnFree = freeUsers * cF; freeUsers -= churnFree;
    var churnS1 = s1 * cS1; s1 -= churnS1;
    var churnS2 = s2 * cS2; s2 -= churnS2;
    var churnS3 = 0;
    for (var ci = 0; ci < cohortsS3.length; ci++) { var L = cohortsS3[ci].count * cS3; churnS3 += L; cohortsS3[ci].count -= L; }

    /* --- Domanda S3 diretta (referral + PR): non passa dall'app --- */
    var refBook = (m >= p.referral.startMonth) ? cohortsCount(cohortsS3) * p.referral.ratePerS3Client * p.referral.bookingRate : 0;
    var borBook = p.borrowed.s3BookingsByPhase[phase] || 0;
    if (isPre) { borBook = (m >= LAUNCH_M - 1) ? borBook : 0; refBook = 0; }
    var directBookings = (refBook + borBook) * season;
    var newS3directRaw = directBookings * p.directShowRate * p.directToClient * risk.clientMult;

    /* --- Domanda (desiderata) di conversione dagli stock post-churn --- */
    var newS1des = freeUsers * p.freemium.freeToS1;
    var newS2des = s1 * p.freemium.s1ToS2;
    var newS3appDes = s2 * p.freemium.s2ToS3 * risk.clientMult;
    var newS3des = newS3appDes + newS3directRaw;

    /* --- Capacità umana: serve prima gli S2/S3 esistenti, poi i nuovi S2 e S3 --- */
    var s2ServiceHours = s2 * p.hoursPerS2ConsultMonth;
    var s3ServiceHours = cohortsCount(cohortsS3) * (p.hoursPerS3ReviewYear || 0) / 12;
    var serviceHours = s2ServiceHours + s3ServiceHours;
    var hoursNew = newS2des * p.hoursPerS2ConsultMonth + newS3des * p.hoursPerS3Onboarding;
    var util = totHours > 0 ? (serviceHours + hoursNew) / totHours : 0;

    /* --- Assunzioni dinamiche --- */
    var totalPaying = s1 + s2 + cohortsCount(cohortsS3);
    if (!hasContent && m >= h.contentMinMonth && (freeUsers + s1) >= h.contentTriggerUsers) {
      hasContent = true; hiringPlan.push({ month: m, monthLabel: label, role: 'Content/quant (consigli per classe)', cost: h.contentCost, trigger: h.contentTriggerUsers + ' utenti' });
    }
    if (!hasDev && m >= h.devMinMonth && (freeUsers + s1) >= h.devTriggerUsers) {
      hasDev = true; hiringPlan.push({ month: m, monthLabel: label, role: 'Dev/manutenzione app', cost: h.devCost, trigger: h.devTriggerUsers + ' utenti' });
    }
    if (!hasBackOffice && m >= h.backOfficeMinMonth && totalPaying >= h.backOfficeTriggerClients) {
      hasBackOffice = true; hiringPlan.push({ month: m, monthLabel: label, role: 'Back-office', cost: h.backOfficeCost, trigger: h.backOfficeTriggerClients + ' clienti paganti' });
    }
    if (m >= h.firstConsultantMonth && hiredConsultants < h.maxConsultants && util > h.utilTrigger && (m - lastConsultantHireMonth) >= 3) {
      hiredConsultants++; lastConsultantHireMonth = m;
      consHours = hiredConsultants * h.consultantHoursPerWeek * 4.33;
      totHours = fHours + consHours;
      serviceHours = s2 * p.hoursPerS2ConsultMonth + s3ServiceHours;
      util = totHours > 0 ? (serviceHours + hoursNew) / totHours : 0;
      hiringPlan.push({ month: m, monthLabel: label, role: 'Consulente #' + hiredConsultants, cost: h.consultantCost, trigger: 'capacità al ' + Math.round(util * 100) + '%' });
    }

    /* --- Throttle dei nuovi high-touch (S2/S3) alla capacità residua (S1/free non toccati) --- */
    var availNew = Math.max(0, totHours - serviceHours);
    var capScale = (m >= LAUNCH_M && hoursNew > availNew && hoursNew > 0) ? availNew / hoursNew : 1;
    var capLimited = capScale < 0.999;
    var newS2 = newS2des * capScale;
    var newS3app = newS3appDes * capScale;
    var newS3direct = newS3directRaw * capScale;
    var newS3 = newS3app + newS3direct;
    var s3Util = util;

    /* --- Budget factor: ads si riducono quando il bacino free satura il TAM --- */
    var sat = (p.market.tamFree > 0) ? freeUsers / p.market.tamFree : 0;
    var budgetFactor = 1.0;
    if (p.budgetCapAdjust && m >= LAUNCH_M && sat > p.budgetCapThreshold) {
      budgetFactor = Math.max(0.1, 1 - (sat - p.budgetCapThreshold) / (1 - p.budgetCapThreshold));
    }
    var bG = bGFull * budgetFactor, bM = bMFull * budgetFactor, bT = bTFull * budgetFactor;

    /* --- Download effettivi con saturazione TAM (app viva da M0) --- */
    var dl = downloadsFrom(bG, bM, bT);
    var tamFactor = (p.market.tamFree > 0) ? Math.max(0, 1 - freeUsers / p.market.tamFree) : 1;
    var newDownloads = isPre ? 0 : dl.total * tamFactor;
    var paidDownloads = isPre ? 0 : dl.paid * tamFactor;
    var newS1 = newS1des;

    /* --- Aggiorna stock --- */
    freeUsers = Math.max(0, freeUsers + newDownloads - newS1);
    s1 = Math.max(0, s1 + newS1 - newS2);
    s2 = Math.max(0, s2 + newS2 - newS3app);
    if (newS3 > 0) cohortsS3.push({ count: newS3, birthMonth: m });

    /* --- Lista d'attesa al lancio (download + spinta diretta su S1) --- */
    var waitingBoost = 0;
    if (m === LAUNCH_M) {
      freeUsers += p.waitingList.count;
      waitingBoost = p.waitingList.count * p.waitingList.toS1Rate;
      if (waitingBoost > 0) { s1 += waitingBoost; freeUsers = Math.max(0, freeUsers - waitingBoost); }
    }

    /* --- Attualizzazione su dati reali --- */
    var act = p.actuals || {};
    var isActual = act.currentMonth > 0 && m <= act.currentMonth;
    if (act.currentMonth > 0 && m === act.currentMonth) {
      if (act.freeUsers > 0) freeUsers = act.freeUsers;
      if (act.s1 > 0) s1 = act.s1;
      if (act.s2 > 0) s2 = act.s2;
      if (act.s3 > 0) {
        var cc = cohortsCount(cohortsS3);
        if (cc > 0) { var sc = act.s3 / cc; for (var cs = 0; cs < cohortsS3.length; cs++) cohortsS3[cs].count *= sc; }
        else cohortsS3.push({ count: act.s3, birthMonth: Math.max(1, m - 6) });
      }
      if (act.cashBalance > 0) cash = act.cashBalance;
    }

    var s3Clients = cohortsCount(cohortsS3);

    /* --- Strato 3: AUM + ricavi (competenza) + incassi (cassa, fatturazione anticipata) --- */
    var r12 = p.aum.portfolioReturn / 12;
    var mktF = 1 + (p.aum.marketShock || 0);
    var dd = p.aum.dist, sumPct = dd ? (dd.s_pct + dd.m_pct + dd.l_pct) : 0;
    var effAvgAUM = (sumPct > 0.01) ? (dd.s_pct * dd.s_avg + dd.m_pct * dd.m_avg + dd.l_pct * dd.l_avg) / sumPct : p.aum.avgPerClient;
    var netPMT = (p.aum.annualContributions - effAvgAUM * (p.aum.annualWithdrawalRate || 0)) / 12;
    var lag = p.assetTransferLagMonths || 0;
    var s3 = p.s3, feeAum = s3.feeRate + (s3.bonusBps || 0);
    var billPer = p.s3Billing === 'mensile' ? 1 : (p.s3Billing === 'semestrale' ? 6 : 12);
    var totalAUM = 0, payingAUM = 0, payingS3 = 0, grossS3comp = 0, grossS3cash = 0;
    for (var ck = 0; ck < cohortsS3.length; ck++) {
      var cAge = m - cohortsS3[ck].birthMonth;
      var cnt = cohortsS3[ck].count;
      var aumPer = effAvgAUM * mktF * Math.pow(1 + r12, cAge)
        + (cAge > 0 && Math.abs(netPMT) > 0.01 ? netPMT * (Math.pow(1 + r12, cAge) - 1) / r12 : 0);
      totalAUM += cnt * aumPer;
      if (cAge >= lag) {
        payingS3 += cnt; payingAUM += cnt * aumPer;
        var annualFee = (p.s3FeeMode === 'aum') ? (cnt * aumPer) * feeAum
                      : (p.s3FeeMode === 'fissa') ? cnt * s3.fixedAnnual
                      : cnt * (s3.baseFare + s3.checkpointsPerYear * s3.checkpointFee);
        grossS3comp += annualFee / 12;                                              // competenza mensile
        if ((cAge - lag) % billPer === 0) grossS3cash += annualFee * (billPer / 12); // incasso anticipato del periodo
      }
    }
    var s3LoadAnnual = (p.s3FeeMode === 'aum') ? effAvgAUM * feeAum
                     : (p.s3FeeMode === 'fissa') ? s3.fixedAnnual
                     : (s3.baseFare + s3.checkpointsPerYear * s3.checkpointFee);

    /* --- Ricavi lordi per strato --- */
    var grossS1 = s1 * p.priceS1;
    var grossS2 = s2 * p.priceS2 + s2 * (p.s2PackagesPerClientYr / 12) * p.s2PackagePrice;
    var grossMrr = grossS1 + grossS2 + grossS3comp;

    /* --- IVA scorporata + commissioni di incasso → NETTO --- */
    var vat = p.vatRate || 0, vatF = 1 / (1 + vat);
    var pm = p.payments || { inAppShare: 0, storeFeeRate: 0, webFeeRate: 0 };
    var effFee = pm.inAppShare * pm.storeFeeRate + (1 - pm.inAppShare) * pm.webFeeRate;
    var appNetF = Math.max(0, vatF - effFee);   // S1/S2: IVA + commissioni di incasso
    var revS1 = grossS1 * appNetF;
    var revS2 = grossS2 * appNetF;
    var revS3 = grossS3comp * vatF;             // S3: solo IVA (bonifico, niente commissioni)
    var mrr = revS1 + revS2 + revS3;            // competenza netta

    /* --- Incassi (cassa) netti: S1/S2 mensili, S3 secondo fatturazione scelta --- */
    var cashS3 = grossS3cash * vatF;
    var cashInflow = revS1 + revS2 + cashS3;

    /* --- Costi --- */
    var constCost = constitutionForMonth(m, p.constitution);
    var capexTech = techCapexForMonth(m, p.tech);
    var opBase = 0, ok = Object.keys(p.operating);
    for (var oi = 0; oi < ok.length; oi++) opBase += p.operating[ok[oi]];
    var opCost = opBase * risk.costMult + techRecurringForMonth(m, p.tech);

    var founderActive = m >= p.personnel.compStartMonth;
    var persCost = (founderActive ? p.personnel.founderComp * p.personnel.numFounders * (1 + p.personnel.inpsRate * 2 / 3) : 0);
    if (hasContent) persCost += h.contentCost;
    if (hasDev) persCost += h.devCost;
    if (hasBackOffice) persCost += h.backOfficeCost;
    persCost += hiredConsultants * h.consultantCost;

    var mktCost = (bG + bM + bT) * risk.costMult;

    var totCostPreTax = constCost + capexTech + opCost + persCost + mktCost;
    revWindow12.push(mrr); costWindow12.push(totCostPreTax);
    if (revWindow12.length > 12) { revWindow12.shift(); costWindow12.shift(); }
    var trailingProfit = Math.max(0, sum(revWindow12) - sum(costWindow12));
    var taxCost = 0;
    if (p.taxation.enabled && m >= LAUNCH_M) {
      taxCost = trailingProfit * p.taxation.iresRate / 12 + Math.max(0, mrr - opCost) * p.taxation.irapRate;
    }
    var totCost = totCostPreTax + taxCost;

    /* --- Benchmark S&P (per confronto AUM) --- */
    if (m === LAUNCH_M) benchValue = totalAUM;
    else if (m > LAUNCH_M) benchValue = benchValue * (1 + benchMonthly);

    /* --- CAC paid → S1: attribuisce al paid la frazione di download che diventerà S1 nel ciclo di vita --- */
    var lifetimeFreeToS1 = (p.freemium.freeToS1 + p.churn.free) > 0 ? p.freemium.freeToS1 / (p.freemium.freeToS1 + p.churn.free) : 0;
    paidCumSpend += (bG + bM + bT);
    paidCumS1 += paidDownloads * lifetimeFreeToS1;
    mktCumSpend += mktCost;
    newPayingCum += newS1 + newS3direct;   // nuovi paganti acquisiti (S1 d'ingresso + S3 diretti); S2/S3-app = upgrade

    /* --- Iniezioni di capitale (mese sim. 1-48) --- */
    var injection = 0;
    if (p.capitalInjections) for (var inj = 0; inj < p.capitalInjections.length; inj++) {
      var cinj = p.capitalInjections[inj];
      if (cinj && cinj.amount > 0 && Math.round(cinj.month) === m) injection += cinj.amount;
    }

    revCum += mrr; costCum += totCost;
    var netBurn = totCost - mrr;                       // burn di competenza (operativo)
    var cashFlow = cashInflow - totCost + injection;   // movimento di cassa reale (incassi − costi + iniezioni)
    cash += cashFlow;
    if (cash < cashMin) { cashMin = cash; cashMinMonth = m; }
    if (cashZeroMonth === null && cash < 0) cashZeroMonth = m;
    if (reserveBreachMonth === null && cash < reserveTarget) reserveBreachMonth = m;

    var staffCount = p.personnel.numFounders + hiredConsultants + (hasContent ? 1 : 0) + (hasDev ? 1 : 0) + (hasBackOffice ? 1 : 0);

    results.push({
      month: m, monthLabel: label, phase: phase, phaseName: phaseName, isPreRelease: isPre, isActual: isActual, calMonth: calMonth,
      googleBudget: bG, metaBudget: bM, tiktokBudget: bT, newDownloads: newDownloads,
      freeUsers: freeUsers, s1Clients: s1, s2Clients: s2, s3Clients: s3Clients, payingS3: payingS3,
      totalPaying: s1 + s2 + s3Clients,
      newS1: newS1, newS2: newS2, newS3: newS3, newS3app: newS3app, newS3direct: newS3direct,
      churnFree: churnFree, churnS1: churnS1, churnS2: churnS2, churnS3: churnS3,
      revS1: revS1, revS2: revS2, revS3: revS3, mrr: mrr, s3LoadAnnual: s3LoadAnnual,
      grossMrr: grossMrr, cashInflow: cashInflow, cashS3: cashS3, injection: injection, cashFlow: cashFlow,
      totalAUM: totalAUM, effAvgAUM: effAvgAUM, benchValue: benchValue,
      constitutionCosts: constCost, techCapex: capexTech, operatingCosts: opCost,
      personnelCosts: persCost, marketingCosts: mktCost, taxCost: taxCost, totalCosts: totCost,
      netBurn: netBurn, cashRemaining: cash, revenueCumulative: revCum, costsCumulative: costCum,
      s3Utilization: s3Util, budgetFactor: budgetFactor, capacityLimited: capLimited,
      hiredConsultants: hiredConsultants, hasContent: hasContent, hasDev: hasDev, hasBackOffice: hasBackOffice,
      staffCount: staffCount
    });
  }

  var beOp = null, beCum = null, beCashCum = null, opc = 0;
  for (var i = 0; i < results.length; i++) {
    if (beOp === null && results[i].mrr >= results[i].totalCosts && results[i].month >= LAUNCH_M) beOp = results[i].month;
    if (beCum === null && results[i].revenueCumulative >= results[i].costsCumulative) beCum = results[i].month;
    opc += results[i].cashInflow - results[i].totalCosts;
    if (beCashCum === null && results[i].month >= LAUNCH_M && opc >= 0) beCashCum = results[i].month;
  }

  return {
    results: results, breakEvenOperational: beOp, breakEvenCumulative: beCum, breakEvenCashCumulative: beCashCum,
    cacPaidS1: paidCumS1 > 0 ? paidCumSpend / paidCumS1 : 0,
    cacBlended: newPayingCum > 0 ? mktCumSpend / newPayingCum : 0,
    cashMinimum: cashMin, cashMinimumMonth: cashMinMonth,
    cashZeroMonth: cashZeroMonth, reserveBreachMonth: reserveBreachMonth, reserveTarget: reserveTarget,
    fundingNeed: Math.max(0, reserveTarget - cashMin),
    hiringPlan: hiringPlan
  };
};

function cohortsCount(cohorts) { var t = 0; for (var i = 0; i < cohorts.length; i++) t += cohorts[i].count; return t; }
function sum(arr) { var t = 0; for (var i = 0; i < arr.length; i++) t += arr[i]; return t; }
function logistic(base, K, g, m) {
  if (!K || K <= base) return base;
  return K / (1 + ((K - base) / base) * Math.exp(-g * (m - 1)));
}

/* Goal-seek: trova il valore minimo della leva (monotòna crescente) che rende vero il predicato */
window.PROXIMA.goalSeek = function (baseParams, leverPath, lo, hi, predicate) {
  var p0 = JSON.parse(JSON.stringify(baseParams));
  function ok(v) {
    var p = JSON.parse(JSON.stringify(p0)), ref = p;
    for (var i = 0; i < leverPath.length - 1; i++) ref = ref[leverPath[i]];
    ref[leverPath[leverPath.length - 1]] = v;
    return predicate(window.PROXIMA.simulate(p, HORIZON));
  }
  if (ok(lo)) return { achievable: true, value: lo, already: true };
  if (!ok(hi)) return { achievable: false };
  for (var k = 0; k < 38; k++) { var mid = (lo + hi) / 2; if (ok(mid)) hi = mid; else lo = mid; }
  return { achievable: true, value: hi };
};

</script>

<script type="text/babel" data-presets="env,react">

function Panel({ id, title, openState, onToggle, children }) {

const PL = ["Costituzione", "App MVP", "Lancio S1", "Strato 2", "Strato 3", "Scala naz."];

function PhaseBudgets({ channel, label, params, updateArray }) {

      ))}

}

window.PROXIMA.Controls = function Controls({ params, setParams, onReset }) {
  const [open, setOpen] = React.useState({
    scenario: true, capital: true, funnel: true, pricing: true, s3fee: true, revenue: true,
    google: false, meta: false, tiktok: false, organic: false, direct: false,
    aum: false, capacity: true, hiring: false, tech: true, injections: false,
    constitution: false, operating: false, personnel: true,
    seasonality: false, taxation: false, attualizzazione: false
  });
  const toggle = React.useCallback((k) => setOpen((p) => ({ ...p, [k]: !p[k] })), []);

  const update = (path, value) => {
    const next = JSON.parse(JSON.stringify(params));
    let ref = next;
    for (let i = 0; i < path.length - 1; i++) ref = ref[path[i]];
    ref[path[path.length - 1]] = value;
    setParams(next);
  };
  const updateArray = (path, idx, value) => {
    const next = JSON.parse(JSON.stringify(params));
    let ref = next;
    for (let i = 0; i < path.length - 1; i++) ref = ref[path[i]];
    ref[path[path.length - 1]][idx] = value;

  };
  const S = (path, label, min, max, step, fmt) => (
    <Slider label={label} value={path.reduce((o, k) => o[k], params)}
      min={min} max={max} step={step} fmt={fmt} onChange={(v) => update(path, v)} />
  );
  const eurCpc = (v) => "€" + num2(v);
  const pct0 = (v) => (v * 100).toFixed(0) + "%";
  const bps = (v) => (v * 100).toFixed(2) + "%";

  return (
    <div>
      <div className="brand"><h1>Proxima</h1><span className="brand-tag">Modello SCF · a strati</span></div>
      <div className="subtitle">Fee-only · 48 mesi (M-6 → M+41) · 3 strati · aggiornamento in tempo reale</div>
      <div className="toolbar"><button className="btn-ghost btn" onClick={onReset}>↻ Reset</button></div>

      <Panel id="scenario" title="Scenario di rischio" openState={open} onToggle={toggle}>
        <div className="scenario-group">
          {["base", "recessione", "crisi"].map((s) => (
            <button key={s} className={"scenario-btn scenario-" + s + (params.riskScenario === s ? " active" : "")}
              onClick={() => update(["riskScenario"], s)}>{s}</button>
          ))}
        </div>
      </Panel>

      <Panel id="capital" title="Capitale iniziale" openState={open} onToggle={toggle}>
        {S(["startingCapital"], "Cassa disponibile per il lancio", 50000, 350000, 5000, eur)}
        <div className="text-faint" style={{ fontSize: 11, marginTop: 6 }}>
          Lean ~€120-140K · Base ~€180-230K (default = €180K del piano) · Scale ~€280-330K.
        </div>
      </Panel>

      <Panel id="injections" title="Iniezioni di capitale" openState={open} onToggle={toggle}>
        <div className="text-faint" style={{ fontSize: 11, marginBottom: 10 }}>
          Fino a 2 versamenti successivi (soci o investitore). Importo 0 = disattivato. Per testare "quanto e quando" serve per non bucare la riserva.
        </div>
        {[0, 1].map((i) => (
          <div key={i} style={{ marginBottom: 8 }}>
            <div className="uppercase text-faint" style={{ marginBottom: 6 }}>Iniezione {i + 1}</div>
            {S(["capitalInjections", i, "month"], "Mese", 7, 48, 1, mlab)}
            {S(["capitalInjections", i, "amount"], "Importo", 0, 200000, 5000, eur)}
          </div>
        ))}
      </Panel>

      <Panel id="funnel" title="Funnel freemium (conversioni mensili)" openState={open} onToggle={toggle}>
        {S(["leadToDownload"], "% lead → download app gratis", 0.2, 0.9, 0.01, pct)}
        {S(["market", "tamFree"], "Mercato indirizzabile (max utenti free)", 2000, 80000, 1000, (v) => Math.round(v).toLocaleString("it-IT"))}
        {S(["freemium", "freeToS1"], "% utenti free → S1 (abbonati base)", 0.01, 0.20, 0.005, pct)}
        {S(["freemium", "s1ToS2"], "% S1 → S2 (upgrade pacchetti)", 0.01, 0.15, 0.005, pct)}
        {S(["freemium", "s2ToS3"], "% S2 → S3 (consulenza in presenza)", 0.005, 0.10, 0.005, pct)}
        <div className="uppercase text-faint" style={{ marginTop: 10, marginBottom: 6 }}>Abbandono mensile per strato</div>
        {S(["churn", "free"], "Churn utenti free", 0.02, 0.20, 0.005, pct)}
        {S(["churn", "s1"], "Churn S1", 0.005, 0.10, 0.005, pct)}
        {S(["churn", "s2"], "Churn S2", 0.005, 0.08, 0.005, pct)}
        {S(["churn", "s3"], "Churn S3", 0.002, 0.03, 0.001, pct)}
        <div className="uppercase text-faint" style={{ marginTop: 10, marginBottom: 6 }}>Lista d'attesa al lancio (M0)</div>
        {S(["waitingList", "count"], "Download al lancio", 0, 1000, 25, (v) => v + " download")}
        {S(["waitingList", "toS1Rate"], "% che si abbona subito (S1)", 0, 1, 0.05, pct)}
      </Panel>

      <Panel id="pricing" title="Pricing Strato 1 e 2" openState={open} onToggle={toggle}>
        <div className="uppercase text-faint" style={{ marginBottom: 6 }}>Strato 1 — abbonamento base</div>
        {S(["priceS1"], "Prezzo S1 (€/mese)", 0, 25, 1, (v) => "€" + v + "/mese")}

<script type="text/babel" data-presets="env,react">
/* Boardroom — C1 sopravvivenza & raccolta · C2 metriche da board · C3 bilancio annuale & export */
window.PROXIMA = window.PROXIMA || {};

window.PROXIMA.Boardroom = function Boardroom({ sim, params, setParams }) {
  const { results } = sim;
  const eur = (v) => "€ " + Math.round(v).toLocaleString("it-IT");
  const eurk = (v) => "€" + Math.round(v / 1000).toLocaleString("it-IT") + "k";
  const num = (v) => Math.round(v).toLocaleString("it-IT");
  const pct = (v) => (v * 100).toFixed(0) + "%";
  const pct1 = (v) => (v * 100).toFixed(1) + "%";
  const ml = (mo) => (mo == null) ? "—" : window.PROXIMA.monthLabel(mo);
  const x1 = (v) => v == null ? "—" : v.toFixed(1) + "×";

  const Kpi = ({ label, value, sub, accent, danger }) =>
    React.createElement("div", { className: "kpi-card" + (accent ? " accent" : ""), style: danger ? { borderColor: "#F87171" } : undefined },
      React.createElement("div", { className: "kpi-label" }, label),
      React.createElement("div", { className: "kpi-value mono", style: danger ? { color: "#F87171" } : undefined }, value),
      sub && React.createElement("div", { className: "kpi-sub text-dim" }, sub));

  const L = (results.find((r) => r.monthLabel === "M0") || { month: 7 }).month;
  const lastIdx = results.length - 1, last = results[lastIdx], prev = results[lastIdx - 1] || last;
  const y1ago = results[lastIdx - 12];

  /* ---- C1: sopravvivenza & raccolta ---- */
  const runwayMonths = sim.cashZeroMonth != null ? (sim.cashZeroMonth - L) : null;

  /* ---- C2: board metrics & unit economics ---- */
  const arr = last.mrr * 12;
  const mom = prev.mrr > 0 ? last.mrr / prev.mrr - 1 : 0;
  const yoy = (y1ago && y1ago.mrr > 0) ? last.mrr / y1ago.mrr - 1 : null;
  const arpuS1 = last.s1Clients > 0 ? last.revS1 / last.s1Clients : 0;
  const arpuS2 = last.s2Clients > 0 ? last.revS2 / last.s2Clients : 0;
  const arpuS3 = last.payingS3 > 0 ? last.revS3 / last.payingS3 : 0;
  const ch = params.churn;
  const ltvS1 = ch.s1 > 0 ? arpuS1 / ch.s1 : 0;
  const ltvS2 = ch.s2 > 0 ? arpuS2 / ch.s2 : 0;
  const ltvS3 = ch.s3 > 0 ? arpuS3 / ch.s3 : 0;
  const cac = sim.cacBlended;
  const ltvCacS1 = cac > 0 ? ltvS1 / cac : null;
  const payback = arpuS1 > 0 ? cac / arpuS1 : null;
  const wChurnM = last.mrr > 0 ? (ch.s1 * last.revS1 + ch.s2 * last.revS2 + ch.s3 * last.revS3) / last.mrr : 0;
  const grr = Math.max(0, 1 - wChurnM * 12);
  const expM = last.mrr > 0 ? (last.newS2 * arpuS2 + last.newS3app * arpuS3) / last.mrr : 0;
  const nrr = Math.max(0, 1 - wChurnM * 12 + expM * 12);
  const win = (n, f) => { let s = 0; for (let i = Math.max(0, lastIdx - n + 1); i <= lastIdx; i++) s += f(results[i]); return s; };
  const netRev12 = win(12, (r) => r.mrr);
  const ebitda12 = win(12, (r) => r.mrr - r.operatingCosts - r.personnelCosts - r.marketingCosts);
  const ebitdaMargin = netRev12 > 0 ? ebitda12 / netRev12 : 0;
  const rule40 = (yoy != null ? yoy * 100 : 0) + ebitdaMargin * 100;
  const netBurn12 = win(12, (r) => r.totalCosts - r.cashInflow);
  const netNewARR12 = (y1ago ? (last.mrr - y1ago.mrr) : last.mrr) * 12;
  const burnMultiple = netNewARR12 > 0 && netBurn12 > 0 ? netBurn12 / netNewARR12 : null;
  const mktg12 = win(12, (r) => r.marketingCosts);
  const magic = mktg12 > 0 ? netNewARR12 / mktg12 : null;

  /* ---- C3: bilancio annuale ---- */
  const yearDefs = [
    { label: "Pre-lancio", lo: 1, hi: L - 1 },
    { label: "Anno 1", lo: L, hi: L + 11 },
    { label: "Anno 2", lo: L + 12, hi: L + 23 },
    { label: "Anno 3", lo: L + 24, hi: L + 35 },
    { label: "Anno 4", lo: L + 36, hi: L + 47 }
  ];
  const yearRows = yearDefs.map((yd) => {
    const rs = results.filter((r) => r.month >= yd.lo && r.month <= yd.hi);
    if (!rs.length) return null;
    const S = (f) => rs.reduce((a, r) => a + f(r), 0);
    const netRev = S((r) => r.mrr);
    return {
      label: yd.label, span: rs[0].monthLabel + "–" + rs[rs.length - 1].monthLabel,
      revS1: S((r) => r.revS1), revS2: S((r) => r.revS2), revS3: S((r) => r.revS3), netRev: netRev,
      capex: S((r) => r.constitutionCosts + r.techCapex), op: S((r) => r.operatingCosts),
      pers: S((r) => r.personnelCosts), mktg: S((r) => r.marketingCosts), tax: S((r) => r.taxCost),
      ebitda: netRev - S((r) => r.operatingCosts + r.personnelCosts + r.marketingCosts),
      result: netRev - S((r) => r.totalCosts), incassi: S((r) => r.cashInflow),
      inj: S((r) => r.injection), cashEnd: rs[rs.length - 1].cashRemaining
    };
  }).filter(Boolean);

  /* ---- Goal-seek ---- */
  const targets = [
    { id: "reserve", label: "Cassa sempre ≥ riserva", pred: (s) => s.cashMinimum >= s.reserveTarget },
    { id: "positive", label: "Cassa mai negativa", pred: (s) => s.cashMinimum >= 0 },
    { id: "beop12", label: "Pareggio operativo entro M+12", pred: (s) => s.breakEvenOperational != null && s.breakEvenOperational <= L + 12 },
    { id: "beop18", label: "Pareggio operativo entro M+18", pred: (s) => s.breakEvenOperational != null && s.breakEvenOperational <= L + 18 },
    { id: "p1000", label: "1.000 paganti entro M+24", pred: (s) => s.results.some((r) => r.month <= L + 24 && r.totalPaying >= 1000) }
  ];
  const levers = [
    { id: "priceS1", label: "Prezzo S1 (€/mese)", path: ["priceS1"], lo: 1, hi: 25, fmt: (v) => "€" + v.toFixed(2) + "/mese" },
    { id: "priceS2", label: "Prezzo S2 (€/mese)", path: ["priceS2"], lo: 9, hi: 120, fmt: (v) => "€" + Math.round(v) + "/mese" },
    { id: "freeToS1", label: "Conversione free→S1", path: ["freemium", "freeToS1"], lo: 0.01, hi: 0.20, fmt: pct1 },
    { id: "s1ToS2", label: "Conversione S1→S2", path: ["freemium", "s1ToS2"], lo: 0.01, hi: 0.15, fmt: pct1 },
    { id: "capital", label: "Capitale iniziale", path: ["startingCapital"], lo: 50000, hi: 400000, fmt: eur }
  ];
  const [gsTarget, setGsTarget] = React.useState("reserve");
  const [gsLever, setGsLever] = React.useState("priceS1");
  const [gsRes, setGsRes] = React.useState(null);
  const runGoalSeek = () => {
    const t = targets.find((x) => x.id === gsTarget), l = levers.find((x) => x.id === gsLever);
    setGsRes({ r: window.PROXIMA.goalSeek(params, l.path, l.lo, l.hi, t.pred), l: l, t: t });
  };
  const applyGoalSeek = () => {
    if (!gsRes || !gsRes.r.achievable) return;
    const next = JSON.parse(JSON.stringify(params)); let ref = next;
    for (let i = 0; i < gsRes.l.path.length - 1; i++) ref = ref[gsRes.l.path[i]];
    ref[gsRes.l.path[gsRes.l.path.length - 1]] = gsRes.r.value; setParams(next);
    setGsRes(null);
  };

  /* ---- Export / import / stampa ---- */
  const exportParams = () => {
    const blob = new Blob([JSON.stringify(params, null, 2)], { type: "application/json" });
    const u = URL.createObjectURL(blob); const a = document.createElement("a");
    a.href = u; a.download = "proxima-scenario.json"; a.click(); URL.revokeObjectURL(u);
  };
  const importParams = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { try { setParams(Object.assign({}, window.PROXIMA.defaultParams(), JSON.parse(rd.result))); } catch (err) { alert("File non valido"); } };
    rd.readAsText(f); e.target.value = "";
  };

  const danger = sim.fundingNeed > 0 || sim.cashZeroMonth != null;

  return (
    <div>
      {/* ============ C1 — Sopravvivenza & raccolta ============ */}
      <div className="section">
        <div className="section-title">Sopravvivenza & raccolta</div>
        {danger ? (
          <div className="warn-banner" style={{ background: "rgba(248,113,113,0.10)", borderColor: "rgba(248,113,113,0.35)", color: "#F87171", marginBottom: 16 }}>
            ⚠ La cassa {sim.cashZeroMonth != null ? <b>&nbsp;va sotto zero a {ml(sim.cashZeroMonth)}</b> : <span>&nbsp;scende sotto la riserva a {ml(sim.reserveBreachMonth)}</span>}.
            Punto più basso {eur(sim.cashMinimum)} a {ml(sim.cashMinimumMonth)}. Per restare sopra la riserva servono ~<b>&nbsp;{eur(sim.fundingNeed)}</b>&nbsp; (iniezione consigliata entro {ml(Math.max(L, sim.cashMinimumMonth - 2))}).
          </div>
        ) : (
          <div className="info-banner" style={{ background: "rgba(74,222,128,0.08)", borderColor: "rgba(74,222,128,0.25)", color: "#4ADE80", marginBottom: 16 }}>
            ✓ Con i parametri attuali la cassa resta sopra la riserva di {eur(sim.reserveTarget)} per tutti i 48 mesi. Nessuna raccolta aggiuntiva necessaria.
          </div>
        )}
        <div className="kpi-grid">
          <Kpi label="Runway" value={runwayMonths != null ? runwayMonths + " mesi" : "oltre l'orizzonte"} sub={sim.cashZeroMonth != null ? "cassa zero a " + ml(sim.cashZeroMonth) : "cassa sempre positiva"} danger={sim.cashZeroMonth != null} />
          <Kpi label="Cassa minima" value={eur(sim.cashMinimum)} sub={"a " + ml(sim.cashMinimumMonth)} danger={sim.cashMinimum < sim.reserveTarget} />
          <Kpi label="Fabbisogno di raccolta" value={eur(sim.fundingNeed)} sub={sim.fundingNeed > 0 ? "per restare ≥ riserva" : "nessuno"} accent={sim.fundingNeed > 0} />
          <Kpi label="Pareggio di cassa" value={ml(sim.breakEvenCashCumulative)} sub="cassa operativa cumulata ≥ 0" />
        </div>

        <div className="card" style={{ marginTop: 16 }}>
          <div className="card-title">Goal-seek — "cosa serve per…"</div>
          <div className="card-sub">Scegli un obiettivo e la leva: il modello calcola il valore minimo che lo raggiunge (binary search sull'intero modello).</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 10, alignItems: "center" }}>
            <select value={gsTarget} onChange={(e) => { setGsTarget(e.target.value); setGsRes(null); }}
              style={{ background: "#0C1420", color: "#E8ECF2", border: "1px solid #2A3952", borderRadius: 8, padding: "8px 10px", fontFamily: "inherit", fontSize: 13 }}>
              {targets.map((t) => <option key={t.id} value={t.id}>{t.label}</option>)}
            </select>
            <span className="text-faint">agendo su</span>
            <select value={gsLever} onChange={(e) => { setGsLever(e.target.value); setGsRes(null); }}
              style={{ background: "#0C1420", color: "#E8ECF2", border: "1px solid #2A3952", borderRadius: 8, padding: "8px 10px", fontFamily: "inherit", fontSize: 13 }}>
              {levers.map((l) => <option key={l.id} value={l.id}>{l.label}</option>)}
            </select>
            <button className="btn" onClick={runGoalSeek}>Calcola</button>
          </div>
          {gsRes && (
            <div style={{ marginTop: 14, padding: "12px 14px", background: "#0C1420", border: "1px solid #2A3952", borderRadius: 8 }}>
              {!gsRes.r.achievable ? (
                <span style={{ color: "#F87171" }}>Obiettivo <b>non raggiungibile</b> con "{gsRes.l.label}" nel suo intervallo. Prova un'altra leva o un obiettivo meno ambizioso.</span>
              ) : gsRes.r.already ? (
                <span style={{ color: "#4ADE80" }}>✓ L'obiettivo è <b>già soddisfatto</b> con i parametri attuali (anche al minimo di "{gsRes.l.label}").</span>
              ) : (
                <div style={{ display: "flex", flexWrap: "wrap", gap: 12, alignItems: "center" }}>
                  <span>Serve <b className="gold mono" style={{ fontSize: 18 }}>{gsRes.l.fmt(gsRes.r.value)}</b> di "{gsRes.l.label}".</span>
                  <button className="btn-ghost btn" onClick={applyGoalSeek}>Applica al modello</button>
                </div>
              )}
            </div>
          )}
        </div>
      </div>

      {/* ============ C2 — Board metrics & unit economics ============ */}
      <div className="section">
        <div className="section-title">Metriche da board & unit economics</div>
        <div className="kpi-grid">
          <Kpi label="ARR (run-rate)" value={eur(arr)} sub={(yoy != null ? "YoY " + (yoy >= 0 ? "+" : "") + pct(yoy) + " · " : "") + "MoM " + (mom >= 0 ? "+" : "") + pct1(mom)} accent />
          <Kpi label="CAC blended" value={eur(cac)} sub="spesa mktg / nuovo pagante" />
          <Kpi label="LTV/CAC (S1 d'ingresso)" value={ltvCacS1 != null ? x1(ltvCacS1) : "—"} sub={"payback " + (payback != null ? Math.round(payback) + " mesi" : "—")} />
          <Kpi label="NRR (stima)" value={pct(nrr)} sub={"GRR " + pct(grr) + " + espansione upgrade"} />
          <Kpi label="Burn multiple" value={x1(burnMultiple)} sub="cassa bruciata / ARR netto nuovo (12m)" />
          <Kpi label="Rule of 40" value={Math.round(rule40) + ""} sub={"crescita " + (yoy != null ? Math.round(yoy * 100) : 0) + "% + margine EBITDA " + Math.round(ebitdaMargin * 100) + "%"} accent={rule40 >= 40} />
          <Kpi label="Magic number" value={magic != null ? x1(magic) : "—"} sub="ARR nuovo / spesa mktg (12m)" />
          <Kpi label="EBITDA margin (12m)" value={pct(ebitdaMargin)} sub={eur(ebitda12) + " su " + eur(netRev12)} />
        </div>
        <div className="card" style={{ marginTop: 16 }}>
          <div className="card-title">LTV per strato (lordo, al netto di IVA e commissioni)</div>
          <div className="tbl-wrap">
            <table className="proj" style={{ fontSize: 13 }}>
              <thead><tr>
                <th style={{ textAlign: "left" }}>Strato</th><th>ARPU netto/mese</th><th>Churn mensile</th><th>Vita media</th><th>LTV</th><th>LTV/CAC</th>
              </tr></thead>
              <tbody>
                {[["S1", arpuS1, ch.s1, ltvS1, "#60A5FA"], ["S2", arpuS2, ch.s2, ltvS2, "#A78BFA"], ["S3", arpuS3, ch.s3, ltvS3, "#C4A962"]].map(([nm, ar, cu, lt, col]) => (
                  <tr key={nm}>
                    <td style={{ textAlign: "left", color: col, fontWeight: 700 }}>{nm}</td>
                    <td className="mono">{eur(ar)}</td>
                    <td className="mono">{pct1(cu)}</td>
                    <td className="mono">{cu > 0 ? Math.round(1 / cu) + " mesi" : "—"}</td>
                    <td className="mono" style={{ fontWeight: 700 }}>{eur(lt)}</td>
                    <td className="mono">{cac > 0 ? x1(lt / cac) : "—"}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="text-faint" style={{ fontSize: 11, marginTop: 8 }}>
            LTV = ARPU netto ÷ churn (margine lordo ~100% per S1; S2/S3 al lordo del costo di servizio umano). Il CAC acquisisce soprattutto S1: i clienti che salgono a S2/S3 valgono molto di più (vedi LTV S3).
          </div>
        </div>
      </div>

      {/* ============ C3 — Bilancio annuale & export ============ */}
      <div className="section">
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8, marginBottom: 14 }}>
          <div className="section-title" style={{ margin: 0 }}>Bilancio annuale (competenza)</div>
          <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
            <button className="btn-ghost btn" onClick={exportParams}>↓ Esporta scenario</button>
            <label className="btn-ghost btn" style={{ cursor: "pointer", margin: 0 }}>↑ Importa
              <input type="file" accept="application/json" onChange={importParams} style={{ display: "none" }} />
            </label>
            <button className="btn" onClick={() => window.print()}>🖨 Stampa / PDF</button>
          </div>
        </div>
        <div className="tbl-wrap">
          <table className="proj" style={{ fontSize: 12 }}>
            <thead><tr>
              <th style={{ textAlign: "left" }}>Periodo</th>
              <th>Ric. S1</th><th>Ric. S2</th><th>Ric. S3</th><th>Ricavi netti</th>
              <th>Costituz.+App</th><th>Operativi</th><th>Personale</th><th>Marketing</th>
              <th>EBITDA</th><th>Risultato</th><th>Incassi</th><th>Iniezioni</th><th>Cassa fine</th>
            </tr></thead>
            <tbody>
              {yearRows.map((y) => (
                <tr key={y.label}>
                  <td style={{ textAlign: "left" }}><span style={{ fontWeight: 700 }}>{y.label}</span><span className="text-faint mono" style={{ fontSize: 10, marginLeft: 6 }}>{y.span}</span></td>
                  <td className="mono">{eurk(y.revS1)}</td>
                  <td className="mono">{eurk(y.revS2)}</td>
                  <td className="mono">{eurk(y.revS3)}</td>
                  <td className="mono gold" style={{ fontWeight: 700 }}>{eurk(y.netRev)}</td>
                  <td className="mono text-dim">{eurk(y.capex)}</td>
                  <td className="mono text-dim">{eurk(y.op)}</td>
                  <td className="mono text-dim">{eurk(y.pers)}</td>
                  <td className="mono text-dim">{eurk(y.mktg)}</td>
                  <td className="mono" style={{ fontWeight: 700, color: y.ebitda >= 0 ? "#4ADE80" : "#F87171" }}>{eurk(y.ebitda)}</td>
                  <td className="mono" style={{ fontWeight: 700, color: y.result >= 0 ? "#4ADE80" : "#F87171" }}>{eurk(y.result)}</td>
                  <td className="mono">{eurk(y.incassi)}</td>
                  <td className="mono text-dim">{y.inj > 0 ? eurk(y.inj) : "—"}</td>
                  <td className="mono" style={{ fontWeight: 700, color: y.cashEnd < sim.reserveTarget ? "#F87171" : undefined }}>{eurk(y.cashEnd)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div className="text-faint" style={{ fontSize: 11, marginTop: 8 }}>
          Valori in €k, competenza (ricavi netti di IVA e commissioni). EBITDA = ricavi netti − operativi − personale − marketing (esclude capex e tasse). "Cassa fine" = saldo reale a fine periodo (include fatturazione S3 anticipata e iniezioni). Stampa → "Salva come PDF" per il one-pager da board.
        </div>
      </div>
    </div>
  );
};

</script>

<script type="text/babel" data-presets="env,react">
/* Table — proiezione 48 mesi + export CSV/JSON */
window.PROXIMA = window.PROXIMA || {};

window.PROXIMA.ProjectionTable = function ProjectionTable({ sim }) {
  const { results, breakEvenOperational, breakEvenCumulative } = sim;
  const [showPre, setShowPre] = React.useState(true);
  const [msg, setMsg] = React.useState("");

  const fmtE = (v) => "€" + Math.round(v).toLocaleString("it-IT");
  const fmtN = (v) => Math.round(v).toLocaleString("it-IT");
  const flash = (t) => { setMsg(t); setTimeout(() => setMsg(""), 2500); };

  const cols = [
    ["Mese", null, ""], ["Fase", null, ""],
    ["Free", (r) => fmtN(r.freeUsers), ""],
    ["S1", (r) => fmtN(r.s1Clients), "s1"],
    ["S2", (r) => fmtN(r.s2Clients), "s2"],
    ["S3", (r) => fmtN(r.s3Clients), "s3"],
    ["AUM €k", (r) => fmtN(Math.round(r.totalAUM / 1000)), ""],
    ["Ric. S1", (r) => fmtE(r.revS1), ""],
    ["Ric. S2", (r) => fmtE(r.revS2), ""],
    ["Ric. S3", (r) => fmtE(r.revS3), ""],
    ["MRR netto", (r) => fmtE(r.mrr), "gold"],
    ["Incassi", (r) => fmtE(r.cashInflow), ""],
    ["Costituz.", (r) => r.constitutionCosts > 0 ? fmtE(r.constitutionCosts) : "—", ""],
    ["App/tech", (r) => (r.techCapex > 0 ? fmtE(r.techCapex) : "—"), ""],
    ["Operativi", (r) => fmtE(r.operatingCosts), ""],
    ["Personale", (r) => fmtE(r.personnelCosts), ""],
    ["Marketing", (r) => fmtE(r.marketingCosts), ""],
    ["Costi tot.", (r) => fmtE(r.totalCosts), "bold"],
    ["Burn", (r) => fmtE(r.netBurn), "burn"],
    ["Cash", (r) => fmtE(r.cashRemaining), "cash"],
    ["Team", (r) => fmtN(r.staffCount), ""],
    ["Cap. S3 %", (r) => Math.round(r.s3Utilization * 100) + "%", "util"]
  ];

  const phasePill = (p, name) => React.createElement("span", { className: `pill pill-p${p}` }, name);

  const download = (blob, filename) => {
    const u = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = u; a.download = filename; a.click();
    URL.revokeObjectURL(u);
  };
  const exportCSV = () => {
    const hdr = ["Mese", "Fase", "Free", "S1", "S2", "S3", "AUM", "RicS1", "RicS2", "RicS3", "MRR", "Costituzione", "AppTech", "Operativi", "Personale", "Marketing", "CostiTot", "Burn", "Cash", "Team", "CapacitaS3%"];
    const rows = results.map((r) => [
      r.monthLabel, r.phaseName, Math.round(r.freeUsers), Math.round(r.s1Clients), Math.round(r.s2Clients), Math.round(r.s3Clients),
      Math.round(r.totalAUM), Math.round(r.revS1), Math.round(r.revS2), Math.round(r.revS3), Math.round(r.mrr),
      Math.round(r.constitutionCosts), Math.round(r.techCapex), Math.round(r.operatingCosts), Math.round(r.personnelCosts),
      Math.round(r.marketingCosts), Math.round(r.totalCosts), Math.round(r.netBurn), Math.round(r.cashRemaining), r.staffCount,
      Math.round(r.s3Utilization * 100)
    ].join(";"));
    download(new Blob([hdr.join(";") + "\n" + rows.join("\n")], { type: "text/csv;charset=utf-8" }), "proxima-scf-48m.csv");
    flash("CSV scaricato");
  };
  const exportJSON = () => {
    download(new Blob([JSON.stringify(results, null, 2)], { type: "application/json" }), "proxima-scf-48m.json");
    flash("JSON scaricato");
  };

  const visible = showPre ? results : results.filter((r) => !r.isPreRelease);
  const tdStyle = (flag, r) => {
    if (flag === "bold") return { fontWeight: 700 };
    if (flag === "gold") return { color: "#D4A843", fontWeight: 700 };
    if (flag === "s1") return { color: "#60A5FA" };
    if (flag === "s2") return { color: "#A78BFA" };
    if (flag === "s3") return { color: "#C4A962", fontWeight: 600 };
    if (flag === "burn") return { fontWeight: 700, color: r.netBurn > 0 ? "#ef4444" : "#4ade80" };
    if (flag === "cash") return { fontWeight: 700, color: r.cashRemaining < 15000 ? "#ef4444" : undefined };
    if (flag === "util") return { color: r.s3Utilization > 0.85 ? "#F59E0B" : "#8B98B0" };
    return undefined;
  };

  return React.createElement("div", { className: "section" },
    React.createElement("div", { style: { display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14, flexWrap: "wrap", gap: 8 } },
      React.createElement("div", { className: "section-title", style: { margin: 0 } }, "Tabella completa 48 mesi"),
      React.createElement("div", { style: { display: "flex", gap: 8, alignItems: "center" } },
        msg && React.createElement("span", { className: "text-dim", style: { fontSize: 12 } }, msg),
        React.createElement("label", { style: { fontSize: 12, display: "flex", alignItems: "center", gap: 4, cursor: "pointer" } },
          React.createElement("input", { type: "checkbox", checked: showPre, onChange: () => setShowPre(!showPre) }), "Pre-lancio"),
        React.createElement("button", { className: "btn-ghost btn", onClick: exportCSV }, "↓ CSV"),
        React.createElement("button", { className: "btn-ghost btn", onClick: exportJSON }, "↓ JSON"))),
    React.createElement("div", { className: "tbl-wrap" },
      React.createElement("table", { className: "proj" },
        React.createElement("thead", null, React.createElement("tr", null, cols.map(([h], i) => React.createElement("th", { key: i }, h)))),
        React.createElement("tbody", null,
          visible.map((r, idx) => {
            const prev = idx > 0 ? visible[idx - 1] : null;
            const cls = [
              prev && r.phase !== prev.phase ? "phase-boundary" : "",
              r.capacityLimited ? "capacity-limited" : "",
              breakEvenOperational === r.month ? "break-even" : "",
              r.isActual ? "actual-data" : "",
              r.isPreRelease ? "pre-release" : ""
            ].filter(Boolean).join(" ");
            return React.createElement("tr", { key: r.month, className: cls || undefined },
              React.createElement("td", null,
                React.createElement("span", { className: "gold mono" }, r.monthLabel),
                React.createElement("span", { className: "text-faint mono", style: { fontSize: 10, marginLeft: 4 } }, "#" + r.month)),
              React.createElement("td", { style: { textAlign: "left" } }, phasePill(r.phase, r.phaseName)),
              ...cols.slice(2).map(([, fn, flag], ci) => React.createElement("td", { key: ci, style: tdStyle(flag, r) }, fn(r))));
          }))))
  );
};

</script>

<script type="text/babel" data-presets="env,react">
/* App — stato, localStorage, layout */
window.PROXIMA = window.PROXIMA || {};
const STORAGE_KEY = "proxima.scf.params.v2";

function deepMerge(target, source) {
  const out = { ...target };
  for (const key of Object.keys(source)) {
    if (source[key] && typeof source[key] === "object" && !Array.isArray(source[key])
        && target[key] && typeof target[key] === "object" && !Array.isArray(target[key])) {
      out[key] = deepMerge(target[key], source[key]);
    } else { out[key] = source[key]; }
  }
  return out;
}
function loadParams() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return window.PROXIMA.defaultParams();
    return deepMerge(window.PROXIMA.defaultParams(), JSON.parse(raw));
  } catch (e) { return window.PROXIMA.defaultParams(); }
}

function App() {
  const [params, setParams] = React.useState(loadParams);
  React.useEffect(() => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(params)); } catch (e) {} }, [params]);
  const sim = React.useMemo(() => window.PROXIMA.simulate(params, 48), [params]);
  const resetDefaults = () => { if (confirm("Ripristinare tutti i parametri ai default?")) setParams(window.PROXIMA.defaultParams()); };

  return (
    <div className="app">
      <aside className="sidebar">
        <window.PROXIMA.Controls params={params} setParams={setParams} onReset={resetDefaults} />
      </aside>
      <main className="main">
        <div className="section">
          <div className="info-banner">
            <strong>Modello previsionale SCF a strati.</strong> Proiezione su 48 mesi (M-6 → M+41) di
            clienti, ricavi, costi e cassa per il modello a tre strati (app freemium → pacchetti remoti →
            consulenza in presenza). Ricavo fee-only diretto dal cliente, senza split. I prezzi sono IVA
            inclusa: il modello scorpora IVA e commissioni di incasso (MRR netto) e distingue la competenza
            dagli incassi reali (Strato 3 fatturato in anticipo). La parcella S3 è selezionabile (%AUM, fissa,
            modulare) e puoi simulare iniezioni di capitale. Muovi gli slider per aggiornare tutto in tempo reale.
          </div>
        </div>
        <window.PROXIMA.Glossary />
        <window.PROXIMA.Dashboard sim={sim} params={params} />
        <window.PROXIMA.Boardroom sim={sim} params={params} setParams={setParams} />
        <window.PROXIMA.ProjectionTable sim={sim} />
        <div className="section" style={{ marginTop: 40, paddingTop: 20, borderTop: "1px solid #1E2A3E" }}>
          <div className="text-faint" style={{ fontSize: 11, textAlign: "center" }}>
            Proxima · Modello SCF a strati · 48 mesi · fee-only · S1 freemium / S2 remoto / S3 in presenza
          </div>
        </div>
      </main>
    </div>
  );
}
