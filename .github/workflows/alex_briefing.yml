name: Alex — Briefing Mattutino

on:
  schedule:
    # 5:30 UTC = 6:30 CET (inverno) / 7:30 CEST (estate)
    - cron: '30 5 * * 1-5'
    # Sabato: 6:00 UTC = 7:00 CET
    - cron: '0 6 * * 6'
  workflow_dispatch:
    # Trigger manuale di emergenza (app GitHub su iPad)

permissions:
  contents: write   # necessario per pubblicare su gh-pages

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Calcola data
        id: date
        run: echo "today=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installa dipendenze
        run: pip install -r rassegna-stampa/requirements.txt

      - name: Crea cartelle output
        run: |
          mkdir -p briefings
          mkdir -p rassegna-stampa/code/data/screener_results

      - name: Genera briefing Alex
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIEFING_PORTFOLIO_DIR: ${{ github.workspace }}/rassegna-stampa/portafogli_examples
          BRIEFING_OUTPUT_DIR: ${{ github.workspace }}/briefings
        run: |
          cd rassegna-stampa
          python briefing_pipeline.py --user alex

      - name: Prepara cartella per GitHub Pages
        run: |
          mkdir -p pages
          # URL fissa: alex-latest.html (il Shortcut punta sempre qui)
          cp briefings/${{ steps.date.outputs.today }}-alex.html pages/alex-latest.html
          # Archivia anche con data per storico
          cp briefings/${{ steps.date.outputs.today }}-alex.html \
             pages/${{ steps.date.outputs.today }}-alex.html
          # Pagina indice minimale per navigazione storico
          echo "<meta http-equiv='refresh' content='0;url=alex-latest.html'>" > pages/index.html

      - name: Pubblica su GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages
          publish_branch: gh-pages
          keep_files: true   # mantiene i briefing storici
          commit_message: "briefing Alex ${{ steps.date.outputs.today }}"
