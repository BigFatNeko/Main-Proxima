name: Alex — Briefing Mattutino

on:
  workflow_dispatch:
    # Triggered dall'iPad via Shortcut → GitHub API
    # Nessun cron: gira solo quando Alex accende il dispositivo

jobs:
  generate-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Calcola data di oggi
        id: date
        run: echo "today=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installa dipendenze
        run: pip install -r rassegna-stampa/requirements.txt

      - name: Crea cartelle output
        run: |
          mkdir -p briefings
          mkdir -p rassegna-stampa/code/data/screener_results

      - name: Genera briefing Alex
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIEFING_PORTFOLIO_DIR: ${{ github.workspace }}/rassegna-stampa/portafogli_examples
          BRIEFING_OUTPUT_DIR: ${{ github.workspace }}/briefings
        run: |
          cd rassegna-stampa
          python briefing_pipeline.py --user alex

      - name: Invia briefing via email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "Proxima Daily — Alex ${{ steps.date.outputs.today }}"
          to: ${{ secrets.ALEX_EMAIL }}
          from: "Proxima Briefing <${{ secrets.GMAIL_USERNAME }}>"
          body: "Briefing allegato. Aprilo in Safari per la visualizzazione ottimale."
          attachments: briefings/${{ steps.date.outputs.today }}-alex.html

      - name: Salva come artifact (backup 30 giorni)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-alex-${{ github.run_id }}
          path: briefings/*.html
          retention-days: 30
